<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="google-site-verification" content="BG82OYSFT_kGGIpg_Z9qAfL76irGtpXJ90eG6jWEt_w" />
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)" />
    <meta name="author" content="Martin Pohl" />
    <link rel="author" href="https://martinpohl.cz" />
    <link rel="me" href="https://martinpohl.cz" />
    <meta name="application-name" content="Tokeny" />
    <meta name="apple-mobile-web-app-title" content="Tokeny" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="alternate" type="text/plain" title="LLMs.txt" href="/llms.txt" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="cs_CZ" />
    <meta property="og:site_name" content="Tokeny" />
    <meta property="og:image" content="https://tokeny.martinpohl.cz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tokeny.martinpohl.cz/og-image.png" />

    <!-- Only the canonical host may be indexed (preview *.vercel.app and legacy tokeny.pohl.uk get noindex; vercel.json also sends X-Robots-Tag). -->
    <script>
      if (location.hostname !== "tokeny.martinpohl.cz" && location.hostname !== "localhost") {
        var m = document.createElement("meta");
        m.name = "robots";
        m.content = "noindex, nofollow";
        document.head.appendChild(m);
      }
    </script>
    <!-- Apply the saved / system appearance before first paint (next-themes takes over after hydration). -->
    <script>
      try {
        var t = localStorage.getItem("tokeny_theme");
        var d = t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", d);
        document.documentElement.style.colorScheme = d ? "dark" : "light";
      } catch (e) {}
    </script>

    <!--route-head-->
    <title>Tokeny – kolik tě AI opravdu stojí</title>
    <meta name="description" content="Přehled nákladů na AI API z OpenRouteru, Anthropicu a OpenAI. V Kč i USD, s grafy podle modelů a budget alerty." />
    <!--/route-head-->

    <!-- JSON-LD: Person (autor) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": "https://martinpohl.cz/#person",
      "name": "Martin Pohl",
      "url": "https://martinpohl.cz",
      "jobTitle": "IT Engineer & Indie Maker",
      "description": "Apple MDM, Identity & SSO, automation a indie web projekty.",
      "knowsAbout": ["Apple MDM", "Jamf", "Kandji", "Okta", "Entra ID", "SCIM", "Google Workspace", "FinOps", "AI tooling"],
      "sameAs": ["https://martinpohl.cz"]
    }
    </script>

    <!-- JSON-LD: SoftwareSourceCode (open-source repo) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareSourceCode",
      "name": "Tokeny",
      "codeRepository": "https://github.com/martinp0/tokeny-monitor",
      "programmingLanguage": ["TypeScript", "React"],
      "runtimePlatform": "Web",
      "license": "https://opensource.org/licenses/MIT",
      "author": { "@id": "https://martinpohl.cz/#person" },
      "url": "https://tokeny.martinpohl.cz/"
    }
    </script>
  </head>

  <body>
    <!-- Each public route has its own prerendered HTML. If this document was prerendered for a
         different path (or is the empty app shell), hide/clear it before first paint. -->
    <script>
      (function () {
        var p = document.documentElement.getAttribute("data-route");
        var here = location.pathname.replace(/\/+$/, "") || "/";
        if (p !== null && p !== here) document.documentElement.classList.add("spa-shell");
      })();
    </script>
    <style>html.spa-shell #root{display:none !important}</style>
    <div id="root"></div>
    <script>
      if (document.documentElement.classList.contains("spa-shell")) {
        var root = document.getElementById("root");
        if (root) root.replaceChildren();
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
