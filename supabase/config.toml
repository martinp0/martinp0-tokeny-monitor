# Supabase project this repo deploys to. Change it (together with .env, vercel.json and the
# Apple xcconfig) with: node scripts/set-backend.mjs <ref> <publishable-key>
# CI links the project from the SUPABASE_PROJECT_REF secret, see ci/supabase-deploy.yml.
project_id = "cfjusewixhycahgxoylm"

[functions]
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.fun-ai]
    verify_jwt = false
  [functions.mcp]
    verify_jwt = false
  [functions.usage-summary]
    verify_jwt = false
  [functions.process-email-queue]
    verify_jwt = true
  [functions.check-budget]
    verify_jwt = true
  [functions.og-dashboard]
    verify_jwt = false
  [functions.get-shared-dashboard]
    verify_jwt = false
  [functions.stripe-webhook]
    verify_jwt = false
  [functions.create-checkout]
    verify_jwt = true
  [functions.check-subscription]
    verify_jwt = true
  [functions.create-portal-session]
    verify_jwt = true
  [functions.auto-sync]
    # Called by pg_cron; authenticated with the x-auto-sync-secret header instead of a JWT.
    verify_jwt = false
