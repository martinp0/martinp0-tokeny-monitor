# Install: move this file to .github/workflows/supabase-deploy.yml (the bot token used to open the
# PR lacks the GitHub `workflow` scope, so it could not push files under .github/workflows).
#
# Deploys the database migrations and all edge functions to Tokeny's own Supabase project (the one
# that replaces Lovable Cloud, see docs/migrate-off-lovable.md). Manual only, on purpose: run it
# from Actions → "Supabase deploy" → Run workflow. Do NOT point it at the Lovable Cloud project.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token, supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   the 20-character ref of the new project
#   SUPABASE_DB_PASSWORD   the database password of that project
# Optional: protect the "production" environment with a required reviewer.
#
# Function secrets (Stripe, Resend, Anthropic, AUTO_SYNC_SECRET …) are NOT managed here; set them
# once with `supabase secrets set` (see the runbook).
name: Supabase deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [migrations-and-functions, migrations, functions]
        default: migrations-and-functions
      dry_run:
        description: Only show pending migrations (no changes)
        type: boolean
        default: true

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Guard against the old Lovable Cloud project
        run: |
          test -n "$PROJECT_REF" || { echo "SUPABASE_PROJECT_REF is not set"; exit 1; }
          if [ "$PROJECT_REF" = "cfjusewixhycahgxoylm" ]; then
            echo "Refusing to deploy to the Lovable Cloud project"; exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Pending migrations
        if: inputs.target != 'functions'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        if: inputs.target != 'functions' && !inputs.dry_run
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy edge functions
        if: inputs.target != 'migrations' && !inputs.dry_run
        # Deploys every function under supabase/functions; verify_jwt per function comes from
        # supabase/config.toml.
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api

      - name: List deployed functions
        if: inputs.target != 'migrations'
        run: supabase functions list --project-ref "$PROJECT_REF"
