# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && cd apple && xcodegen generate && open Tokeny.xcodeproj
name: Tokeny
options:
  bundleIdPrefix: cz.martinpohl
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team in Xcode (Signing & Capabilities) or here. Never commit tokens or certificates.
    DEVELOPMENT_TEAM: GR59NF57R2
    CODE_SIGN_STYLE: Automatic

targets:
  # macOS menu bar app (no Dock icon).
  TokenyMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
        excludes: [ConfigSync.swift]
      - path: SharedUI
      - path: macOS
    entitlements:
      path: macOS/TokenyMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.martinpohl.tokeny.mac
        PRODUCT_NAME: Tokeny
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tokeny
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_HARDENED_RUNTIME: YES

  # iPhone companion: hosts the Watch app and passes it the token.
  Tokeny:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: SharedUI
      - path: iOS
    entitlements:
      path: iOS/Tokeny.entitlements
      properties:
        com.apple.security.application-groups: [group.cz.martinpohl.tokeny]
        keychain-access-groups: [$(AppIdentifierPrefix)cz.martinpohl.tokeny.shared]
    info:
      path: iOS/Info.plist
      properties:
        TokenyKeychainGroup: $(AppIdentifierPrefix)cz.martinpohl.tokeny.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.martinpohl.tokeny
        PRODUCT_NAME: Tokeny
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tokeny
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - target: TokenyWatch

  TokenyWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: watchOS
    entitlements:
      path: watchOS/TokenyWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.cz.martinpohl.tokeny]
        keychain-access-groups: [$(AppIdentifierPrefix)cz.martinpohl.tokeny.shared]
    info:
      path: watchOS/Info.plist
      properties:
        TokenyKeychainGroup: $(AppIdentifierPrefix)cz.martinpohl.tokeny.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.martinpohl.tokeny.watchkitapp
        PRODUCT_NAME: Tokeny
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tokeny
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: cz.martinpohl.tokeny
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
    dependencies:
      - target: TokenyWatchWidget

  # Watch complication (WidgetKit accessory families).
  TokenyWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: Shared
        excludes: [ConfigSync.swift]
      - path: Widget
    entitlements:
      path: Widget/TokenyWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.cz.martinpohl.tokeny]
        keychain-access-groups: [$(AppIdentifierPrefix)cz.martinpohl.tokeny.shared]
    info:
      path: Widget/Info.plist
      properties:
        TokenyKeychainGroup: $(AppIdentifierPrefix)cz.martinpohl.tokeny.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.martinpohl.tokeny.watchkitapp.widget
        PRODUCT_NAME: TokenyWatchWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tokeny
        SKIP_INSTALL: YES
