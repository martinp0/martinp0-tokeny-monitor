# XcodeGen spec for the Tokeny apps. The .xcodeproj is generated, not committed:
#   brew install xcodegen && cd apple && xcodegen generate && open Tokeny.xcodeproj
# Xcode Cloud runs the same command in ci_scripts/ci_post_clone.sh.
name: Tokeny
options:
  bundleIdPrefix: cz.martinpohl
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"

packages:
  TokenyKit:
    path: TokenyKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    # Xcode Cloud sets the build number from CI_BUILD_NUMBER (ci_scripts/ci_pre_xcodebuild.sh).
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    DEVELOPMENT_TEAM: GR59NF57R2
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEAD_CODE_STRIPPING: YES

targets:
  # iPhone app: dashboard, settings, App Intents, background refresh; hosts the widgets and the Watch app.
  Tokeny:
    type: application
    platform: iOS
    sources:
      - path: SharedUI
      - path: Components
      - path: iOS
      - path: Resources
    dependencies:
      - package: TokenyKit
        product: TokenyCore
      - package: TokenyKit
        product: TokenyAuth
      - target: TokenyWidgets
      - target: TokenyWatch
    entitlements:
      path: iOS/Tokeny.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.cz.martinpohl.tokeny]
        keychain-access-groups: [$(AppIdentifierPrefix)cz.martinpohl.tokeny.shared]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TokenyKeychainGroup: $(AppIdentifierPrefix)cz.martinpohl.tokeny.shared
        BGTaskSchedulerPermittedIdentifiers: [cz.martinpohl.tokeny.refresh]
        UIBackgroundModes: [fetch]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.martinpohl.tokeny
        PRODUCT_NAME: Tokeny
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tokeny
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - package: TokenyKit/TokenyCoreTests
        - package: TokenyKit/TokenyAuthTests
      gatherCoverageData: true

  # Home Screen and Lock Screen widgets.
  TokenyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Components
      - path: Resources
      - path: SharedUI/Localizable.xcstrings
    dependencies:
      - package: TokenyKit
        product: TokenyCore
      - package: TokenyKit
        product: TokenyAuth
    entitlements:
      path: Generated/TokenyWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.cz.martinpohl.tokeny]
        keychain-access-groups: [$(AppIdentifierPrefix)cz.martinpohl.tokeny.shared]
    info:
      path: Generated/TokenyWidgets-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TokenyKeychainGroup: $(AppIdentifierPrefix)cz.martinpohl.tokeny.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.martinpohl.tokeny.widgets
        PRODUCT_NAME: TokenyWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tokeny
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # Mac menu bar app (no Dock icon).
  TokenyMac:
    type: application
    platform: macOS
    sources:
      - path: SharedUI
      - path: Components
      - path: macOS
      - path: Resources
    dependencies:
      - package: TokenyKit
        product: TokenyCore
      - package: TokenyKit
        product: TokenyAuth
    entitlements:
      path: macOS/TokenyMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.applesignin: [Default]
    info:
      path: macOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.martinpohl.tokeny.mac
        PRODUCT_NAME: Tokeny
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tokeny
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - package: TokenyKit/TokenyCoreTests
        - package: TokenyKit/TokenyAuthTests

  # Watch app: shows what the iPhone sends over WatchConnectivity (no credentials on the Watch).
  TokenyWatch:
    type: application
    platform: watchOS
    sources:
      - path: watchOS
      - path: Components
      - path: Resources
      - path: SharedUI/Localizable.xcstrings
    dependencies:
      - package: TokenyKit
        product: TokenyCore
      - target: TokenyWatchWidgets
    entitlements:
      path: watchOS/TokenyWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.cz.martinpohl.tokeny]
    info:
      path: Generated/TokenyWatch-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.martinpohl.tokeny.watchkitapp
        PRODUCT_NAME: Tokeny
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tokeny
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: cz.martinpohl.tokeny
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO

  # Watch complications (same widget code as the iPhone, accessory families only).
  TokenyWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Widgets
      - path: Components
      - path: Resources
      - path: SharedUI/Localizable.xcstrings
    dependencies:
      - package: TokenyKit
        product: TokenyCore
    entitlements:
      path: Generated/TokenyWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.cz.martinpohl.tokeny]
    info:
      path: Generated/TokenyWatchWidgets-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.martinpohl.tokeny.watchkitapp.widgets
        PRODUCT_NAME: TokenyWatchWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tokeny
        SKIP_INSTALL: YES
