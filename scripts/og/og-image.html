<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;background:#f4f4f6;color:#1d1d1f;overflow:hidden;position:relative;-webkit-font-smoothing:antialiased}
  .left{position:absolute;left:80px;top:88px;width:520px}
  .logo{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:600;letter-spacing:-.02em}
  .mark{width:48px;height:48px;border-radius:12px;background:#0068da;display:flex;align-items:center;justify-content:center}
  h1{margin-top:56px;font-size:76px;line-height:1.02;font-weight:650;letter-spacing:-.035em}
  h1 span{color:#6e6e73}
  p{margin-top:28px;font-size:26px;line-height:1.35;color:#6e6e73}
  .url{position:absolute;left:80px;bottom:64px;font-size:22px;color:#0068da;font-weight:600}
  .card{position:absolute;right:72px;top:96px;width:470px;height:438px;background:#fff;border-radius:28px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 30px 60px -20px rgba(0,0,0,.18);padding:32px}
  .lbl{font-size:16px;color:#6e6e73;font-weight:500}
  .big{font-size:52px;font-weight:650;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
  .delta{font-size:16px;color:#248a3d;font-weight:600;margin-top:4px}
  .bars{display:flex;align-items:flex-end;gap:12px;height:150px;margin-top:28px;border-bottom:1px solid #e5e5ea;padding-bottom:2px}
  .bars div{flex:1;border-radius:7px 7px 3px 3px;background:#0071e3}
  .rows{margin-top:24px;display:grid;gap:12px}
  .row{display:flex;align-items:center;gap:10px;font-size:16px}
  .dot{width:10px;height:10px;border-radius:50%}
  .row b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="left">
    <div class="logo"><div class="mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>Tokeny</div>
    <h1>Kolik tě AI<br><span>opravdu stojí.</span></h1>
    <p>Náklady na OpenRouter, Anthropic a OpenAI v&nbsp;jednom přehledu. V&nbsp;Kč i USD.</p>
  </div>
  <div class="url">tokeny.martinpohl.cz</div>
  <div class="card">
    <div class="lbl">Náklady tento měsíc</div>
    <div class="big">2 486 Kč</div>
    <div class="delta">−18 % oproti minulému měsíci</div>
    <div class="bars">
      <div style="height:38%;opacity:.35"></div><div style="height:52%;opacity:.35"></div><div style="height:44%;opacity:.35"></div><div style="height:70%;opacity:.35"></div><div style="height:58%;opacity:.35"></div><div style="height:82%;opacity:.35"></div><div style="height:64%"></div><div style="height:92%"></div>
    </div>
    <div class="rows">
      <div class="row"><span class="dot" style="background:#0071e3"></span>Claude Sonnet<b>1 204 Kč</b></div>
      <div class="row"><span class="dot" style="background:#34c759"></span>GPT-5 mini<b>732 Kč</b></div>
      <div class="row"><span class="dot" style="background:#ff9f0a"></span>Gemini Flash<b>550 Kč</b></div>
    </div>
  </div>
</body></html>
